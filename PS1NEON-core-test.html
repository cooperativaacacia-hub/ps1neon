<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PS1NEON — Teste de núcleo</title><style>body{margin:0;background:#050914;color:#eaffff;font:16px Arial;text-align:center}.box{max-width:700px;margin:24px auto;padding:20px;border:1px solid #00ffcc;border-radius:16px;box-shadow:0 0 20px #00ffcc33}h1{color:#00ffcc;text-shadow:0 0 12px #00ffcc}label{display:block;margin:14px 0 6px;color:#ff9aec}input{max-width:100%;padding:8px;background:#101b2b;color:#fff;border:1px solid #55baff;border-radius:8px}button{margin-top:18px;padding:12px 18px;border:1px solid #00ffcc;border-radius:10px;background:#0b2130;color:#fff;font-weight:bold}#status{margin:15px;color:#ffd166;line-height:1.4}#game{width:640px;height:480px;max-width:100%;margin:20px auto}</style></head><body><main class="box"><h1>PS1NEON — teste de núcleo</h1><p>Página isolada. A versão principal não é alterada.</p><label>BIOS própria/legalmente obtida (.bin)</label><input id="bios" type="file" accept=".bin,application/octet-stream"><label>Arquivos do disco (.cue + .bin)</label><input id="gamefiles" type="file" accept=".bin,.cue,.iso" multiple><p>Selecione o <b>.cue e todos os .bin</b> juntos. Para discos de um único BIN, selecione apenas o BIN.</p><button id="start" type="button">INICIAR TESTE PCSX REARMED</button><div id="status">Aguardando BIOS e arquivos do disco.</div><div id="game"></div></main><script>
(function(){const $=id=>document.getElementById(id),status=$('status');$('start').addEventListener('click',function(){try{const b=$('bios').files[0],files=[...$('gamefiles').files];if(!b){status.textContent='Selecione a BIOS .bin.';return}if(!/\.bin$/i.test(b.name)){status.textContent='A BIOS precisa ser .bin; não use ISO ou jogo.';return}if(!files.length){status.textContent='Selecione o jogo. Para CUE, selecione também os BINs da mesma pasta.';return}const cue=files.find(f=>/\.cue$/i.test(f.name)),bin=files.find(f=>/\.bin$/i.test(f.name)&&f!==b),iso=files.find(f=>/\.iso$/i.test(f.name));if(cue&&!bin){status.textContent='O CUE foi escolhido, mas falta o BIN correspondente. Selecione os dois juntos.';return}const game=bin||iso;if(!game){status.textContent='Não encontrei um BIN ou ISO do jogo.';return}status.textContent=cue?'CUE e BIN encontrados. Preparando o disco…':'Preparando o jogo…';window.EJS_player='#game';window.EJS_core='pcsx_rearmed';window.EJS_biosUrl=URL.createObjectURL(b);window.EJS_gameUrl=URL.createObjectURL(game);window.EJS_gameName=game.name;window.EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';const s=document.createElement('script');s.src=window.EJS_pathtodata+'loader.js';s.onerror=()=>status.textContent='Não foi possível carregar o núcleo. Verifique a internet e tente novamente.';document.body.appendChild(s)}catch(e){status.textContent='Falha ao iniciar: '+e.message}})})();
</script></body></html>
