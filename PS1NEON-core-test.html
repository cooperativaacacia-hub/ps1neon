<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PS1NEON — Teste de núcleo</title><style>body{margin:0;background:#050914;color:#eaffff;font:16px Arial;text-align:center}h1{color:#00ffcc;text-shadow:0 0 12px #00ffcc}.box{max-width:700px;margin:24px auto;padding:20px;border:1px solid #00ffcc;border-radius:16px;box-shadow:0 0 20px #00ffcc33}label{display:block;margin:14px 0 6px;color:#ff9aec}input{max-width:100%;padding:8px;background:#101b2b;color:#fff;border:1px solid #55baff;border-radius:8px}button{margin-top:18px;padding:12px 18px;border:1px solid #00ffcc;border-radius:10px;background:#0b2130;color:#fff;font-weight:bold}#status{margin:15px;color:#ffd166}#game{width:640px;height:480px;max-width:100%;margin:20px auto}</style></head><body><main class="box"><h1>PS1NEON — teste de núcleo</h1><p>Esta página é isolada e não altera a versão principal.</p><label>BIOS própria/legalmente obtida (.bin)</label><input id="bios" type="file" accept=".bin,application/octet-stream"><label>Jogo BIN/CUE</label><input id="gamefile" type="file" accept=".bin,.cue,.iso"><br><button id="start" type="button">INICIAR TESTE PCSX REARMED</button><div id="status">Aguardando BIOS e jogo.</div><div id="game"></div></main><script>
(function(){const status=document.getElementById('status');document.getElementById('start').addEventListener('click',function(){try{const b=document.getElementById('bios').files[0],g=document.getElementById('gamefile').files[0];if(!b||!g){status.textContent='Selecione a BIOS e o jogo antes de iniciar.';return}if(!/\.bin$/i.test(b.name)){status.textContent='A BIOS precisa ser um arquivo .bin, não ISO.';return}status.textContent='Carregando o núcleo… aguarde.';window.EJS_player='#game';window.EJS_core='pcsx_rearmed';window.EJS_biosUrl=URL.createObjectURL(b);window.EJS_gameUrl=URL.createObjectURL(g);window.EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';const s=document.createElement('script');s.src=window.EJS_pathtodata+'loader.js';s.onerror=function(){status.textContent='Não foi possível carregar o núcleo. Verifique a internet e tente novamente.'};document.body.appendChild(s)}catch(e){status.textContent='Falha ao iniciar: '+e.message}})})();
</script></body></html>
